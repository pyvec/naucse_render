on:
  push:
    branches:
    - master
  pull_request:

name: Run Tox tests

jobs:
  tox_test:
    name: Tox test
    steps:
    - uses: actions/checkout@v2
    - name: Run Tox tests
      id: test
      uses: fedora-python/tox-github-action@main
      with:
        tox_env: ${{ matrix.tox_env }}
    strategy:
      matrix:
        tox_env: [py311, py312, py313, py314, py315]

    # Use GitHub's Linux Docker host
    runs-on: ubuntu-latest
